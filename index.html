<script>
const verses = [
  {
    ref: "Psalm 46:10",
    text: "Be still, and know that I am God.",
    encouragement: "You do not have to solve everything today. Pause, breathe, and remember that God is with you."
  },
  {
    ref: "Isaiah 41:10",
    text: "Fear not, for I am with you; be not dismayed, for I am your God.",
    encouragement: "Whatever you are facing, you do not have to face it alone."
  },
  {
    ref: "Jeremiah 29:11",
    text: "For I know the plans I have for you, declares the Lord, plans for welfare and not for evil, to give you a future and a hope.",
    encouragement: "Your current season is not the end of your story."
  },
  {
    ref: "Philippians 4:13",
    text: "I can do all things through Christ who strengthens me.",
    encouragement: "Ask God for strength for the next step, not every step at once."
  },
  {
    ref: "Psalm 34:18",
    text: "The Lord is near to the brokenhearted and saves the crushed in spirit.",
    encouragement: "God is especially near when your heart feels heavy."
  },
  {
    ref: "Proverbs 3:5-6",
    text: "Trust in the Lord with all your heart, and do not lean on your own understanding.",
    encouragement: "You can trust God even when you cannot see the whole path."
  }
];

const prayers = [
  "Dear God, thank You for giving me another day. Quiet my heart, guide my decisions, protect my family, and help me trust You with what I cannot control. Give me peace for today and strength for whatever comes next. In Jesus’ name, Amen.",
  "Dear God, when I feel overwhelmed, remind me that I do not have to carry everything by myself. Help me slow down, breathe, pray, and place my worries in Your hands. Give me wisdom and peace. Amen.",
  "Dear God, thank You for Your love and mercy. Help me notice the blessings around me today and carry gratitude into everything I do. Keep my heart close to You. Amen.",
  "Dear God, strengthen my faith when I feel uncertain. Help me remember the times You have carried me before and trust that You are still working in my life. Amen."
];

const feelingData = {
  Anxious: {
    ref: "Philippians 4:6-7",
    verse: "Do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God.",
    prayer: "Dear God, calm my anxious thoughts. Help me release each worry to You and receive Your peace. Guard my heart and mind today. Amen."
  },
  Sad: {
    ref: "Psalm 34:18",
    verse: "The Lord is near to the brokenhearted and saves the crushed in spirit.",
    prayer: "Dear God, meet me in this sadness. Comfort my heart and remind me that I am never alone. Amen."
  },
  Lonely: {
    ref: "Deuteronomy 31:8",
    verse: "It is the Lord who goes before you. He will be with you; He will not leave you or forsake you.",
    prayer: "Dear God, when I feel alone, remind me of Your constant presence. Surround me with healthy love and meaningful connection. Amen."
  },
  Overwhelmed: {
    ref: "Matthew 11:28",
    verse: "Come to me, all who labor and are heavy laden, and I will give you rest.",
    prayer: "Dear God, I am carrying more than I can handle. Help me give You what is too heavy for me and focus on one step at a time. Amen."
  },
  Thankful: {
    ref: "1 Thessalonians 5:18",
    verse: "Give thanks in all circumstances; for this is the will of God in Christ Jesus for you.",
    prayer: "Dear God, thank You for every blessing, big and small. Keep my heart grateful today. Amen."
  },
  Faithful: {
    ref: "Hebrews 11:1",
    verse: "Now faith is the assurance of things hoped for, the conviction of things not seen.",
    prayer: "Dear God, continue growing my faith. Help me trust You even when I cannot see what You are doing. Amen."
  },
  Hopeful: {
    ref: "Romans 15:13",
    verse: "May the God of hope fill you with all joy and peace in believing.",
    prayer: "Dear God, fill me with hope for what is ahead. Help me remain faithful in the present. Amen."
  },
  Angry: {
    ref: "James 1:19",
    verse: "Let every person be quick to hear, slow to speak, slow to anger.",
    prayer: "Dear God, help me slow down before I react. Give me wisdom to express what I feel without hurting myself or others. Replace anger with peace. Amen."
  }
};

function todayIndex(length) {
  const d = new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  const day = Math.floor((d - start) / 86400000);
  return day % length;
}

function showVerse() {
  const v = verses[todayIndex(verses.length)];

  const text = document.getElementById("verseText");
  const ref = document.getElementById("verseRef");
  const encouragement = document.getElementById("verseEncouragement");

  if (text) text.textContent = v.text;
  if (ref) ref.textContent = "— " + v.ref;
  if (encouragement) encouragement.textContent = v.encouragement;
}

function showPrayer() {
  const prayer = document.getElementById("prayerText");

  if (prayer) {
    prayer.textContent = prayers[todayIndex(prayers.length)];
  }
}

function showFeeling(name) {
  const f = feelingData[name];
  const box = document.getElementById("feelingResult");

  if (!box || !f) return;

  box.hidden = false;

  box.innerHTML =
    "<h3>" + name + "</h3>" +
    "<div><em>“" + f.verse + "”</em><br><strong>— " + f.ref + "</strong></div>" +
    "<div style='margin-top:15px'><strong>Prayer:</strong><br>" + f.prayer + "</div>";

  box.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

document.addEventListener("DOMContentLoaded", function() {
  showVerse();
  showPrayer();
});
</script>

</body>
</html>
